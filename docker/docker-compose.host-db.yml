# Use with docker-compose.vps.yml so API/web/admin can reach Ubuntu host Postgres.
#   docker compose -f docker/docker-compose.vps.yml -f docker/docker-compose.host-db.yml --env-file .env.production up -d
#
# DATABASE_URL must use host.docker.internal:5432 (not the Compose postgres service).

services:
  api:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  web:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  admin:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
